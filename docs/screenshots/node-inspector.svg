<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="inspectorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0"/>
      <stop offset="100%" style="stop-color:#fff"/>
    </linearGradient>
    <filter id="inspectorGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur" in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="#fff3e0"/>
  
  <!-- Left panel -->
  <rect x="20" y="20" width="280" height="360" fill="#12122a" stroke="#2a2a4a" stroke-width="1" rx="8"/>
  
  <!-- Header -->
  <text x="140" y="60" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#fff">Node Inspector</text>
  <text x="140" y="85" font-family="system-ui, sans-serif" font-size="12" fill="#888">Node: 4. Writing</text>
  
  <!-- Node details -->
  <text x="140" y="110" font-family="system-ui, sans-serif" font-size="12" fill="#888">Type: Agent • Model: gpt-4o-mini</text>
  
  <!-- Prompt section -->
  <rect x="140" y="150" width="280" height="100" rx="6" fill="#0d0d1a" stroke="#2a2a4a" stroke-width="1"/>
  <text x="150" y="170" font-family="system-ui, sans-serif" font-size="12" fill="#ccc">Prompt</text>
  <text x="150" y="185" font-family="system-ui, sans-serif" font-size="12" fill="#ccc">Write a complete blog post following the outline...</text>
  <text x="150" y="195" font-family="system-ui, sans-serif" font-size="12" fill="#ccc">Target: ~1500 words. Tone: professional...</text>
  
  <!-- Output Contract section -->
  <rect x="140" y="270" width="280" height="100" rx="6" fill="#0d0d1a" stroke="#2a2a4a" stroke-width="1"/>
  <text x="150" y="290" font-family="system-ui, sans-serif" font-size="12" fill="#888">Output Contract (JSON Schema)</text>
  <rect x="140" y="300" width="280" height="80" rx="6" fill="#0d0d1a" stroke="#2a2a4a" stroke-width="1"/>
  <text x="150" y="315" font-family="monospace" font-size="10" fill="#00ff88">
    {</text>
  <text x="170" y="325" font-family="monospace" font-size="10" fill="#00ff88">draft: string,</text>
  <text x="170" y="340" font-family="monospace" font-size="10" fill="#00ff88">word_count: number</text>
  <text x="150" y="360" font-family="monospace" font-size="10" fill="#00ff88">}</text>
  
  <!-- MCP Servers -->
  <rect x="140" y="380" width="280" height="60" rx="6" fill="#0d0d1a" stroke="#2a2a4a" stroke-width="1"/>
  <text x="150" y="400" font-family="system-ui, sans-serif" font-size="12" fill="#888">MCP Servers</text>
  <text x="150" y="400" font-family="system-ui, sans-serif" font-size="12" fill="#ccc">✓ Sodeom Search</text>
  <text x="150" y="420" font-family="system-ui, sans-serif" font-size="12" fill="#ccc">✓ Trillionir AI</text>
  
  <!-- Retry Policy -->
  <rect x="140" y="450" width="280" height="60" rx="6" fill="#0d0d1a" stroke="#2a2a4a" stroke-width="1"/>
  <text x="150" y="470" font-family="system-ui, sans-serif" font-size="12" fill="#888">Retry Policy</text>
  <text x="150" y="470" font-family="system-ui, sans-serif" font-size="12" fill="#ccc">Max retries: 1 • Timeout: 120s</text>
  
  <!-- Right panel (node visualization) -->
  <rect x="320" y="20" width="280" height="360" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1" rx="8"/>
  <text x="330" y="60" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#2e7d32">Node: 4. Writing</text>
  
  <!-- Node visualization -->
  <g transform="translate(340, 120)">
    <!-- Node container -->
    <ellipse cx="150" cy="150" rx="130" ry="40" fill="#00d4ff25" stroke="#00d4ff" stroke-width="2" filter="url(#inspectorGlow)"/>
    <circle cx="280" cy="150" r="8" fill="#00d4ff"/>
    
    <!-- Node label -->
    <text x="150" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#00d4ff">4. Writing ⚡</text>
    
    <!-- Node description -->
    <text x="150" y="180" font-family="system-ui, sans-serif" font-size="12" fill="#888">Type: Agent • Model: gpt-4o-mini</text>
    <text x="150" y="195" font-family="system-ui, sans-serif" font-size="12" fill="#888">Status: running...</text>
    
    <!-- Status indicator -->
    <circle cx="120" cy="140" r="6" fill="#00d4ff">
      <animate attributeName="r" values="6;10;6" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Output contract -->
    <text x="150" y="240" font-family="monospace" font-size="10" fill="#00ff88">
      {draft: string, word_count: number}
    </text>
  </g>
  
  <!-- Bottom info -->
  <text x="140" y="350" font-family="system-ui, sans-serif" font-size="12" fill="#888">Retry Policy: Max retries: 1 • Timeout: 120s</text>
</svg>